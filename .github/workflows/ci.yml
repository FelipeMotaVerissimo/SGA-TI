name: CI

# Roda a cada push e a cada pull request, em qualquer branch.
on:
  push:
  pull_request:

jobs:
  testes:
    name: Testes, migrations e backup (MySQL real)
    runs-on: ubuntu-latest

    # O ganho principal deste CI: a suíte de integração passa a rodar contra um
    # MySQL de verdade a cada push. Na máquina de desenvolvimento ela roda em
    # SQLite, e o que o SQLite não consegue validar — SQL gerado, migrations,
    # tipos nativos, ENUM, constraints e $transaction real — ficava dependendo
    # de homologação manual.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: raiz_do_ci
          MYSQL_DATABASE: sga_ti_teste
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -praiz_do_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: "mysql://root:raiz_do_ci@127.0.0.1:3306/sga_ti_teste"
      TEST_DATABASE_URL: "mysql://root:raiz_do_ci@127.0.0.1:3306/sga_ti_teste"
      SESSION_SECRET: segredo_de_sessao_do_ci
      JWT_SECRET: segredo_jwt_do_ci
      NODE_ENV: test
      # Lida pelo mysql/mysqldump no passo de backup. Senha por variavel de
      # ambiente, nunca por argumento.
      MYSQL_PWD: raiz_do_ci

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Mesma versão da máquina de desenvolvimento. O Node 20 chegou ao fim da
      # vida em abril de 2026; rodar o CI nele validaria um ambiente que ninguém
      # mais deveria usar.
      - name: Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar o Prisma Client (schema de MySQL)
        run: npx prisma generate --schema prisma/schema.prisma

      # --------------------------------------------------------------------
      # Migrations
      # --------------------------------------------------------------------
      - name: Aplicar as migrations num banco vazio
        run: npx prisma migrate deploy --schema prisma/schema.prisma

      - name: Conferir que as migrations reproduzem o schema
        # `migrate diff` entre o banco criado pelas migrations e o
        # schema.prisma precisa voltar VAZIO. Se divergir, alguém editou o
        # schema sem gerar a migration correspondente — defeito que só
        # apareceria na hora de subir para produção.
        run: |
          npx prisma migrate diff \
            --from-url "$DATABASE_URL" \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code \
          && echo "Banco e schema estão iguais."

      - name: Seed
        run: npm run seed

      # --------------------------------------------------------------------
      # Testes
      # --------------------------------------------------------------------
      - name: Testes unitários
        run: npm run test:unit

      - name: Testes de integração
        # Suíte completa, sem exclusão. O auth.test.js, que falhava desde antes
        # da consolidação, foi reescrito contra o schema real (defeito D06).
        run: npm run test:integration

      # --------------------------------------------------------------------
      # NF006 - ciclo completo de backup e restauracao
      # --------------------------------------------------------------------
      # Responde a pendencia P01 do docs/BACKUP.md: o ciclo nunca tinha sido
      # executado, por falta de mysqldump e de um MySQL na maquina de
      # desenvolvimento. Aqui os dois existem, e a prova passa a ser continua.
      #
      # Roda depois dos testes de proposito: o banco fica com dados espalhados
      # pelas tabelas, e nao so com o seed. O que se compara e origem contra
      # copia, entao os numeros em si nao importam - importa que sejam iguais.
      - name: NF006 - gerar o dump
        run: npm run backup

      - name: NF006 - restaurar num banco novo e comparar
        run: bash scripts/conferir-restauracao.sh
